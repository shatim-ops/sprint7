services:
  # Одноразовый шаг: собирает FAISS-индекс в общий том.
  indexer:
    build: .
    env_file: .env
    command: python scripts/build_index.py
    volumes:
      - index:/app/index
      - models:/app/.cache/huggingface

  bot:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - index:/app/index
      - models:/app/.cache/huggingface
    depends_on:
      indexer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  index:
  models:
